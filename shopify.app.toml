# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "96a0b97fa5f49fb98e8bb6e0778cd58d"
name = "AI UGC Generator"
handle = "motionart"
application_url = "https://motionart.onrender.com"
embedded = true

[access_scopes]
# Shopify-managed installation: scopes are declared here and granted at install time.
# The server does NOT pass a `scopes` array into shopifyApp()'s config — see
# server/src/config/shopify.js.
scopes = "read_products,write_products"
use_legacy_install_flow = false

[auth]
# Kept for Partner Dashboard/CLI validation. The server uses token exchange
# (future.tokenExchange) for embedded auth, so this callback path is not actually
# hit in normal operation.
redirect_urls = [ "https://motionart.onrender.com/api/auth/callback" ]

[webhooks]
# Keep this in sync with CURRENT_API_VERSION in server/src/config/shopify.js —
# it's a separate hardcoded value here (the CLI config) from there (the SDK
# config), and nothing enforces they match automatically.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks"

  # The three mandatory GDPR/compliance topics can't be declared via `topics` in
  # current API versions — `shopify app deploy` rejects them there with "invalid
  # topic" (confirmed live against 2026-07). They must use `compliance_topics`
  # instead, on their own subscription block.
  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact", "customers/redact", "customers/data_request" ]
  uri = "/api/webhooks"

[pos]
embedded = false
